<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060b17">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} · {% endif %}Q1X Community Orchestrator</title>
  <link rel="icon" href="{{ '/assets/brand/favicon.ico' | relative_url }}" sizes="any">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Q1X Community Orchestrator home">
        <img class="brand-logo" src="{{ '/assets/brand/q1x-logo-transparent.png' | relative_url }}" alt="Q1X">
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="{{ '/architecture.html' | relative_url }}">Architecture</a>
        <a href="{{ '/use-cases.html' | relative_url }}">Use cases</a>
        <a href="{{ '/deployment.html' | relative_url }}">Deployment</a>
        <a href="{{ '/review-model.html' | relative_url }}">Governance</a>
        <a href="{{ '/roadmap.html' | relative_url }}">Roadmap</a>
        <a href="{{ '/licensing.html' | relative_url }}">Licensing</a>
      </nav>
    </div>
  </header>
  <main id="content" class="shell content">{{ content }}</main>
  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>Built by Quoralinex.</span>
      <span>Provider-neutral · OS-neutral · local-first capable.</span>
    </div>
  </footer>
</body>
</html>
