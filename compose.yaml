services:
  q1x:
    build:
      context: .
      dockerfile: Dockerfile
    image: q1x-community-orchestrator:local
    environment:
      Q1X_HOME: /data
      Q1X_HOST: 0.0.0.0
      Q1X_PORT: '8787'
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - q1x-state:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  q1x-state:
