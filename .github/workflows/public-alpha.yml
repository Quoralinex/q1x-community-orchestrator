name: Public Alpha Commissioning

on:
  pull_request:
    paths:
      - '.github/workflows/public-alpha.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'scripts/release/**'
      - 'tests/**'
      - 'CHANGELOG.md'
      - 'RELEASE_NOTES.md'
      - 'README.md'
      - 'SECURITY.md'
      - 'docs/**'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Create the governed GitHub public-alpha tag and prerelease after validation
        required: true
        type: boolean
        default: false
      publish_npm:
        description: Publish the immutable release tarballs through configured npm trusted publishing
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-alpha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate-public-alpha
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and verify repository
        run: npm run check
      - name: Prepare governed public-alpha artifacts
        run: node scripts/release/prepare-alpha.mjs --output .release --source-sha "$GITHUB_SHA"
      - name: Verify packed packages as an external consumer
        run: node scripts/release/verify-packed-consumer.mjs --artifacts .release
      - name: Verify release manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./.release/release-manifest.json').sourceSha")" = "$GITHUB_SHA"
          test "$(node -p "require('./.release/release-manifest.json').tag")" = "v0.1.0-alpha.2"
          (cd .release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q1x-public-alpha-${{ github.sha }}
          path: .release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  release:
    name: create-github-prerelease
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release == true &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-alpha.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: q1x-public-alpha-${{ github.sha }}
          path: .release
      - name: Reverify immutable release bundle
        run: |
          test "$(node -p "require('./.release/release-manifest.json').sourceSha")" = "$GITHUB_SHA"
          node scripts/release/verify-packed-consumer.mjs --artifacts .release
          (cd .release && sha256sum --check SHA256SUMS)
      - name: Refuse stale main target or release replacement
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$REMOTE_MAIN" != "$GITHUB_SHA" ]]; then
            echo "Protected main moved from ${GITHUB_SHA} to ${REMOTE_MAIN}; refusing a stale release." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to replace an authoritative release identity." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to replace an authoritative release." >&2
            exit 1
          fi
      - name: Create GitHub prerelease at the verified main commit
        run: gh release create "$TAG" .release/* --prerelease --target "$GITHUB_SHA" --title "Q1X Community Orchestrator ${TAG}" --notes-file RELEASE_NOTES.md

  publish-npm:
    name: publish-npm-trusted
    needs: [validate, release]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release == true &&
      inputs.publish_npm == true &&
      github.ref == 'refs/heads/main'
    environment: npm-public-alpha
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: q1x-public-alpha-${{ github.sha }}
          path: .release
      - name: Verify immutable publication inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./.release/release-manifest.json').sourceSha")" = "$GITHUB_SHA"
          (cd .release && sha256sum --check SHA256SUMS)
      - name: Publish contracts with trusted provenance
        run: npm publish --provenance --access public .release/quoralinex-q1x-community-contracts-0.1.0-alpha.2.tgz
      - name: Publish SDK with trusted provenance
        run: npm publish --provenance --access public .release/quoralinex-q1x-community-sdk-0.1.0-alpha.2.tgz
      - name: Publish adapter SDK with trusted provenance
        run: npm publish --provenance --access public .release/quoralinex-q1x-community-adapter-sdk-0.1.0-alpha.2.tgz
      - name: Publish desktop bridge common with trusted provenance
        run: npm publish --provenance --access public .release/quoralinex-q1x-community-desktop-bridge-common-0.1.0-alpha.2.tgz
      - name: Publish macOS desktop bridge with trusted provenance
        run: npm publish --provenance --access public .release/quoralinex-q1x-community-desktop-bridge-macos-0.1.0-alpha.2.tgz
      - name: Publish Windows desktop bridge with trusted provenance
        run: npm publish --provenance --access public .release/quoralinex-q1x-community-desktop-bridge-windows-0.1.0-alpha.2.tgz
      - name: Publish Linux desktop bridge with trusted provenance
        run: npm publish --provenance --access public .release/quoralinex-q1x-community-desktop-bridge-linux-0.1.0-alpha.2.tgz
      - name: Publish runtime with trusted provenance
        run: npm publish --provenance --access public .release/quoralinex-q1x-community-runtime-0.1.0-alpha.2.tgz
