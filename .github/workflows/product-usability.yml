name: Product Usability

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'connectors/**'
      - 'tests/**'
      - 'scripts/phase12/**'
      - '.github/workflows/product-usability.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product-ubuntu-24.04:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install Linux accessibility harness
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-atspi-2.0 at-spi2-core xvfb dbus-x11
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build all first-party packages
        run: npm run build
      - name: Run product usability acceptance
        run: node --test tests/product-usability.test.mjs
      - name: Run Linux desktop bridge harness
        run: node --test tests/desktop-bridge-linux.test.mjs tests/runtime-first-party-desktop.test.mjs
      - name: Exercise Linux AT-SPI bridge in virtual accessibility session
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"protocol":"q1x-desktop-bridge/1","endpoint":{"id":"desktop.phase12.linux","platform":"linux"},"batch":{"contractVersion":"1.0.0","id":"desktop.batch.phase12.linux","actions":[{"id":"apps","kind":"list-applications"}]}}' > /tmp/q1x-phase12-linux-envelope.json
          xvfb-run -a dbus-run-session -- bash -lc 'export XDG_SESSION_TYPE=x11 NO_AT_BRIDGE=0; node packages/desktop-bridge-linux/dist/index.js --doctor > phase12-linux-doctor.json; node packages/desktop-bridge-linux/dist/index.js < /tmp/q1x-phase12-linux-envelope.json > phase12-linux-bridge.json'
          node scripts/phase12/collect-product-evidence.mjs --platform ubuntu --doctor phase12-linux-doctor.json --bridge-result phase12-linux-bridge.json --mode virtual-native --output phase12-product-evidence-ubuntu.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase12-product-evidence-ubuntu
          path: phase12-product-evidence-ubuntu.json

  product-macos-latest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build all first-party packages
        run: npm run build
      - name: Run product usability acceptance
        run: node --test tests/product-usability.test.mjs
      - name: Run macOS Accessibility deterministic harness
        run: node --test tests/desktop-bridge-macos.test.mjs tests/runtime-first-party-desktop.test.mjs
      - name: Capture macOS host doctor evidence
        shell: bash
        run: |
          set -euo pipefail
          node packages/desktop-bridge-macos/dist/index.js --doctor > phase12-macos-doctor.json
          node scripts/phase12/collect-product-evidence.mjs --platform macos --doctor phase12-macos-doctor.json --mode harness-plus-host-doctor --output phase12-product-evidence-macos.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase12-product-evidence-macos
          path: phase12-product-evidence-macos.json

  product-windows-latest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build all first-party packages
        run: npm run build
      - name: Run product usability acceptance
        run: node --test tests/product-usability.test.mjs
      - name: Run Windows UI Automation deterministic harness
        run: node --test tests/desktop-bridge-windows.test.mjs tests/runtime-first-party-desktop.test.mjs
      - name: Capture Windows host doctor evidence
        shell: pwsh
        run: |
          node packages/desktop-bridge-windows/dist/index.js --doctor | Out-File -FilePath phase12-windows-doctor.json -Encoding utf8
          node scripts/phase12/collect-product-evidence.mjs --platform windows --doctor phase12-windows-doctor.json --mode harness-plus-host-doctor --output phase12-product-evidence-windows.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase12-product-evidence-windows
          path: phase12-product-evidence-windows.json
