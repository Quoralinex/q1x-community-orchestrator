name: Product Usability

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'connectors/**'
      - 'tests/**'
      - 'scripts/phase12/**'
      - '.github/workflows/product-usability.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product-ubuntu-24.04:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build all first-party packages
        run: npm run build
      - name: Run product usability acceptance
        run: node --test tests/product-usability.test.mjs

  product-macos-latest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build all first-party packages
        run: npm run build
      - name: Run product usability acceptance
        run: node --test tests/product-usability.test.mjs

  product-windows-latest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build all first-party packages
        run: npm run build
      - name: Run product usability acceptance
        run: node --test tests/product-usability.test.mjs
