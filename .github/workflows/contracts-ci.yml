name: Runtime and Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Locate Chromium-compatible browser for real browser tests
        shell: bash
        run: |
          set -euo pipefail
          for browser in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [[ -x "$browser" ]]; then
              echo "Q1X_TEST_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
              "$browser" --version
              exit 0
            fi
          done
          echo "No Chromium-compatible browser is installed on this runner" >&2
          exit 1
      - name: Build TypeScript workspaces
        run: npm run build
      - name: Self-validate normative schemas
        run: node --test tests/schema-contracts.test.mjs
      - name: Validate existing contract examples
        run: node --test tests/examples.test.mjs
      - name: Compile desktop action schema
        run: node --test --test-name-pattern="desktop action schema compiles" tests/desktop-examples.test.mjs
      - name: Validate desktop endpoint example
        run: node --test --test-name-pattern="desktop endpoint example validates" tests/desktop-examples.test.mjs
      - name: Validate desktop focus application rule
        run: node --test --test-name-pattern="desktop focus application action validates" tests/desktop-examples.test.mjs
      - name: Validate desktop inspect rule
        run: node --test --test-name-pattern="desktop inspect action validates" tests/desktop-examples.test.mjs
      - name: Validate desktop find rule
        run: node --test --test-name-pattern="desktop find action validates" tests/desktop-examples.test.mjs
      - name: Validate desktop batch options
        run: node --test --test-name-pattern="desktop batch options validate" tests/desktop-examples.test.mjs
      - name: Validate desktop action batch example
        run: node --test --test-name-pattern="desktop action batch example validates" tests/desktop-examples.test.mjs
      - name: Run runtime integration tests
        run: npm run test:runtime
      - name: Run strict SDK consumer type test
        run: npm run test:types
      - name: Run distribution and licence tests
        run: npm run test:dist
      - name: Verify package contents
        run: |
          npm pack --dry-run --workspace packages/contracts
          npm pack --dry-run --workspace packages/sdk-typescript
          npm pack --dry-run --workspace packages/runtime
