name: Runtime and Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify contracts, SDK and runtime
        run: npm run check
      - name: Verify package contents
        run: |
          npm pack --dry-run --workspace packages/contracts
          npm pack --dry-run --workspace packages/sdk-typescript
          npm pack --dry-run --workspace packages/runtime
