name: Phase 11 Lock Sync

on:
  push:
    branches:
      - feat/phase11-compatibility-adapter-sdk
    paths:
      - 'packages/adapter-sdk/package.json'
      - '.github/workflows/phase11-lock-sync.yml'

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/phase11-compatibility-adapter-sdk
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Generate lockfile from workspace metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: sync community adapter SDK lockfile'
          git push origin HEAD:feat/phase11-compatibility-adapter-sdk
