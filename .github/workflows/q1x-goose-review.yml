name: Q1X Goose Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  q1x-review:
    if: ${{ github.event.pull_request.draft == false }}
    uses: Quoralinex/goose/.github/workflows/q1x-pr-review.yml@dbfc315f9dcb83e94b12f34e88f2d0732be9434b
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
