name: Cross-platform Packaging

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'connectors/**'
      - 'scripts/phase12/**'
      - 'tests/**'
      - '.github/workflows/cross-platform-packaging.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-install:
    name: local-install-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build workspaces
        run: npm run build
      - name: Run Phase 12 product usability acceptance
        run: node --test tests/product-usability.test.mjs
      - name: Install Linux accessibility harness
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-atspi-2.0 at-spi2-core xvfb dbus-x11
      - name: Verify Linux desktop bridge in virtual accessibility session
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/desktop-bridge-linux.test.mjs tests/runtime-first-party-desktop.test.mjs
          printf '%s\n' '{"protocol":"q1x-desktop-bridge/1","endpoint":{"id":"desktop.phase12.linux","platform":"linux"},"batch":{"contractVersion":"1.0.0","id":"desktop.batch.phase12.linux","actions":[{"id":"apps","kind":"list-applications"}]}}' > /tmp/q1x-phase12-linux-envelope.json
          xvfb-run -a dbus-run-session -- bash -lc 'export XDG_SESSION_TYPE=x11 NO_AT_BRIDGE=0; node packages/desktop-bridge-linux/dist/index.js --doctor > phase12-linux-doctor.json; node packages/desktop-bridge-linux/dist/index.js < /tmp/q1x-phase12-linux-envelope.json > phase12-linux-bridge.json'
          node scripts/phase12/collect-product-evidence.mjs --platform ubuntu --doctor phase12-linux-doctor.json --bridge-result phase12-linux-bridge.json --mode virtual-native --output phase12-product-evidence-ubuntu.json
      - name: Verify macOS desktop bridge harness and doctor
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/desktop-bridge-macos.test.mjs tests/runtime-first-party-desktop.test.mjs
          node packages/desktop-bridge-macos/dist/index.js --doctor > phase12-macos-doctor.json
          node scripts/phase12/collect-product-evidence.mjs --platform macos --doctor phase12-macos-doctor.json --mode harness-plus-host-doctor --output phase12-product-evidence-macos.json
      - name: Verify Windows desktop bridge harness and doctor
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          node --test tests/desktop-bridge-windows.test.mjs tests/runtime-first-party-desktop.test.mjs
          node packages/desktop-bridge-windows/dist/index.js --doctor | Out-File -FilePath phase12-windows-doctor.json -Encoding utf8
          node scripts/phase12/collect-product-evidence.mjs --platform windows --doctor phase12-windows-doctor.json --mode harness-plus-host-doctor --output phase12-product-evidence-windows.json
      - name: Upload Phase 12 product evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase12-product-evidence-${{ matrix.os }}
          path: phase12-product-evidence-*.json
      - name: Verify source installation
        run: node packages/runtime/dist/cli.js --home .q1x-install-check init
      - name: Verify health/readiness lifecycle
        run: node --test tests/runtime-health-service.test.mjs
      - name: Verify contracts and SDK
        run: npm test && npm run test:types && npm run test:dist
      - name: Verify distributable packages
        run: |
          npm pack --dry-run --workspace packages/contracts
          npm pack --dry-run --workspace packages/sdk-typescript
          npm pack --dry-run --workspace packages/runtime

  docker:
    name: docker-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build image
        run: docker build --pull --tag q1x-community-orchestrator:ci .
      - name: Start persistent non-root container
        run: docker run --detach --name q1x --volume q1x-state:/data q1x-community-orchestrator:ci
      - name: Verify container identity and health
        shell: bash
        run: |
          test "$(docker exec q1x id -u)" = "10001"
          for attempt in {1..30}; do
            if docker exec q1x node -e "fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          docker logs q1x
          exit 1
      - name: Verify deterministic restart with persistent state
        shell: bash
        run: |
          docker exec q1x node packages/runtime/dist/cli.js --home /data status
          docker restart q1x
          for attempt in {1..30}; do
            if docker exec q1x node -e "fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              break
            fi
            sleep 1
          done
          docker exec q1x node packages/runtime/dist/cli.js --home /data status
      - name: Stop container cleanly
        if: always()
        run: docker stop --time 10 q1x || true
