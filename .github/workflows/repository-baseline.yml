name: Repository Baseline
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Validate required governance files
        shell: bash
        run: |
          set -euo pipefail
          required=(README.md LICENSE COMMERCIAL-LICENSING.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md .github/CODEOWNERS)
          for file in "${required[@]}"; do test -s "$file" || { echo "Missing or empty: $file"; exit 1; }; done
          git diff --check
      - name: Verify standalone public boundary
        run: npm run verify:standalone
      - name: Verify Phase 12 completion contract
        run: npm run verify:phase12
