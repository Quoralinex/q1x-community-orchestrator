name: Phase 12 Lock Sync

on:
  push:
    branches:
      - feat/phase12-core-usability-ecosystem

permissions:
  contents: write

jobs:
  sync-lock:
    if: ${{ !contains(github.event.head_commit.message, '[phase12-lock]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/phase12-core-usability-ecosystem
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Generate workspace lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lock when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync Phase 12 workspace lock [phase12-lock]"
          git push origin HEAD:feat/phase12-core-usability-ecosystem
