version: 2.1
jobs:
  baseline:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Repository baseline
          command: |
            set -euo pipefail
            test -s README.md
            test -s LICENSE
            test -s CONTRIBUTING.md
            test -s SECURITY.md
            git diff --check
workflows:
  validate:
    jobs:
      - baseline
